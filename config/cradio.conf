# Enable Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DIS=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_HOG=y

# Enable multiple Bluetooth profiles (optional)
CONFIG_ZMK_BLE_ADVERTISEMENT_PRIORITY=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_BT_MAX_CONN=3   # Adjust this for more paired devices
CONFIG_ZMK_BLE_PROFILE_COUNT=5
